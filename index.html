<h2> Introductions</h2>
<form action="" id="name-form">
<label for="fname">First Name:</label><br/>
<input type="text" name="fname" id="fname"><br/>
<label for="lname">Last Name:</label><br/>
<input type="text" name="lname" id="lname"><br/>
<label for="age">Age:</label><br/>
<input type="number" name="age" id="age">
</form> 
<br/>
<input type="button" value="SUBMIT" onclick="greet();">
<p id="greet" style="font-size: x-large;">Welcome!</p>

<h2>Warm up trivia question</h2>
<p> What is the only food that cannot go bad?</p>
<p id="trivia1-answer"> </p>
<form action="">
    <input type="radio" name="trivia1" id="chocolate">
    <label for="chocolate">Dark Chocolate</label><br/>
     <input type="radio" name="trivia1" id="tuna">
    <label for="tuna">Tuna</label><br/>
     <input type="radio" name="trivia1" id="honey">
    <label for="honey">Honey</label><br/>
</form>
<input type="button" value="SUBMIT" onclick="trivia1();">
<script src="javascript/truth.js"></script>

<h2>Two Truths and a Lie</h2>
<p>Which one is true?</p>
<p id="truth-answer"> </p>
<form action="">
    <input type="radio" name="answer1" id="dog">
    <label for="dog">I have a pet dog named Cinnamon</label><br/>
    <input type="radio" name="answer1" id="color">
    <label for="color">My favorite color is purple</label><br/>
    <input type="radio" name="answer1" id="birthday">
    <label for="birthday">My birthday is in summer</label><br/>
</form>
<input type="button" value="SUBMIT" onclick="answer1();">
<script src="javascript/truth.js"></script>
